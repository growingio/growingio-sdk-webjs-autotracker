# 监听创建tag的事件
# 会自动进行发版到npm，同时创建一个release包
name: Publish And Release

on:
  push:
    tags:
      - v*

jobs:
  publish:
    name: Auto Publish npm
    runs-on: ubuntu-latest
    # Trusted Publisher 必需权限：开启OIDC认证权限 + 读取仓库内容
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4 # 升级到最新版，提升稳定性和兼容性
      - uses: actions/setup-node@v4 # 升级到最新版，更好支持Node 22
        with:
          # npm Trusted Publishing 要求 Node >= 22.14.0。
          node-version: 22.14.0
          # 不设置 registry-url：setup-node 会因此写入带 NODE_AUTH_TOKEN 的
          # .npmrc，令 npm 跳过 OIDC Trusted Publishing。
      - name: Enable npm Trusted Publishing
        # Node 22 自带的 npm 可能低于 OIDC Trusted Publishing 所需的 11.5.1。
        run: |
          npm install --global npm@^11.5.1
          npm --version
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
      - name: Build
        run: |
          rm -rf dist || true  # 兼容dist目录不存在的情况，避免构建报错
          npm install  # 统一使用npm（也可保留yarn，不影响Trusted Publisher）
          npm run build:es
      - name: Publish to npm
        # npm CLI 使用 GitHub Actions 的 OIDC 短期令牌；不再依赖长期发布 token。
        run: npm publish --registry=https://registry.npmjs.org/ --tag latest --access public --provenance

  release:
    name: Auto Create Release
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v4 # 升级到最新版
      - uses: actions/setup-node@v4 # 升级到最新版
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub内置Token，无需手动配置
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref_name }} # 优化：直接获取清晰的tag名称（如v1.0.0）
          draft: false
          prerelease: false
